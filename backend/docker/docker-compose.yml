version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hyron-postgres
    environment:
      POSTGRES_DB: hyron
      POSTGRES_USER: hyron
      POSTGRES_PASSWORD: hyron
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
