spring.application.name=Hyron Backend

spring.datasource.url=jdbc:postgresql://localhost:5432/hyron_db
spring.datasource.username=postgres
spring.datasource.password=password

# Aumentar nivel de log para ver por qué falla Swagger
logging.level.org.springdoc=DEBUG
logging.level.io.swagger=DEBUG
logging.level.org.springframework.web=DEBUG

# Importante: Si tienes un manejador de excepciones, esto ayuda a ver la traza
server.error.include-stacktrace=always
server.error.include-message=always